<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a0a0a"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prazo dos Atletas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#0a0a0a;--card:#161616;--text:#f5f5f5;--muted:#a3a3a3;--line:#2b2b2b;--accent:#FFD600;--ok:#22c55e;--warn:#fb923c;--bad:#ef4444;--badbg:#2a1010}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{border-bottom:3px solid var(--accent);padding-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:24px;margin:0;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#000;font-weight:700}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 10px;font-weight:500;font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-top:4px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.warn{border-color:var(--warn);border-top-color:var(--warn)}
.card.bad{border-color:var(--bad);border-top-color:var(--bad);background:var(--badbg);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 22%,transparent)}}
.top{display:flex;gap:12px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;background:var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:22px}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.dates{font-size:13px;color:var(--muted);line-height:1.5}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.warn .bar i{background:var(--warn)}.bad .bar i{background:var(--bad)}
.badge{align-self:flex-start;font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--accent);color:#000}
.warn .badge{background:var(--warn);color:#000}
.bad .badge{background:var(--bad);color:#fff}
.actions{display:flex;gap:6px}
.empty{text-align:center;color:var(--muted);padding:50px 10px;border:2px dashed var(--line);border-radius:16px}
dialog{border:0;border-radius:16px;padding:20px;width:min(380px,92vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=date]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.photo-row{display:flex;gap:12px;align-items:center}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.views{display:flex;gap:6px;flex-wrap:wrap}
.views .vb{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 12px;font-weight:600}
.views .vb.on{background:var(--accent);color:#000;border-color:var(--accent)}
.status{background:#2a2200;border:1px solid var(--accent);color:var(--accent);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
.status.err{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);padding:12px;border-bottom:2px solid var(--accent)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr.bad td{background:var(--badbg)}
tr.bad td:first-child{box-shadow:inset 4px 0 var(--bad)}
tr.warn td:first-child{box-shadow:inset 4px 0 var(--warn)}
td .avatar{width:44px;height:44px;font-size:16px}
td .badge{display:inline-block}
.ac{display:flex;gap:6px;white-space:nowrap}
button.del{color:var(--bad);border-color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Prazo dos Atletas</h1><div class="sub">Prazo de 90 dias a partir da primeira publicação</div></div>
    <div class="views"><button class="vb" id="vc">Cards</button><button class="vb" id="vt">Tabela</button><button id="add">+ Novo atleta</button></div>
  </header>
  <div class="status" id="status" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="dlg">
  <h2 id="dtitle" style="margin:0 0 4px;font-size:18px">Novo atleta</h2>
  <label>Foto</label>
  <div class="photo-row"><div class="avatar" id="prev">?</div><input type="file" id="file" accept="image/*"></div>
  <label>Nome</label><input type="text" id="name" placeholder="Ex.: Matheuzinho">
  <label>Data da primeira publicação</label><input type="date" id="start">
  <div class="sub" id="endinfo" style="margin-top:10px"></div>
  <div class="row-end"><button class="ghost" id="cancel">Cancelar</button><button id="save">Salvar</button></div>
</dialog>

<script>
// ====== CONFIGURAÇÃO DO BANCO (Supabase) ======
var SUPABASE_URL="https://jwhrbtnsnlvscoiswpyd.supabase.co/rest/v1/";
var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aHJidG5zbmx2c2NvaXN3cHlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDM0MzksImV4cCI6MjEwODE3OTQzOX0.wE-TVepKgqAfMIghil1Tqgdxo6dRBNKCVr2kS_xgCjo";
// ===============================================
var KEY="atletas-prazo-v1", list=[], editId=null, photo="";
SUPABASE_URL=SUPABASE_URL.trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"");SUPABASE_KEY=SUPABASE_KEY.trim();
var REMOTE=!!(SUPABASE_URL&&SUPABASE_KEY), API=SUPABASE_URL+"/rest/v1/atletas";
var view="cards";try{view=localStorage.getItem("atletas-view")||"cards"}catch(e){}
function H(x){var h={apikey:SUPABASE_KEY,"Content-Type":"application/json"};if(SUPABASE_KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+SUPABASE_KEY;for(var k in x)h[k]=x[k];return h}
function setStatus(m,err){var el=document.getElementById("status");el.hidden=!m;el.textContent=m||"";el.className="status"+(err?" err":"")}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){alert("Não foi possível salvar neste navegador.")}}
async function load(){
  if(!REMOTE){try{list=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){list=[]}
    setStatus("Modo local: os dados ficam só neste navegador. Configure o Supabase no topo do script para compartilhar com todos.");render();return}
  try{
    var r=await fetch(API+"?select=*&order=start_date.asc",{headers:H()});
    if(!r.ok){var t="";try{t=await r.text()}catch(e2){}throw new Error("HTTP "+r.status+" - "+t.slice(0,200))}
    var rows=await r.json();
    list=rows.map(function(x){return{id:String(x.id),name:x.name,start:x.start_date,photo:x.photo||""}});
    setStatus("");
  }catch(e){setStatus("Não foi possível conectar ao banco. Detalhe: "+(e.message||e),true)}
  render();
}
async function saveAthlete(a,isNew){
  if(!REMOTE){
    if(isNew){a.id=String(Date.now());list.push(a)}else{list=list.map(function(x){return x.id===a.id?a:x})}
    persist();render();return}
  var body=JSON.stringify({name:a.name,start_date:a.start,photo:a.photo});
  var r=isNew?await fetch(API,{method:"POST",headers:H({Prefer:"return=minimal"}),body:body})
             :await fetch(API+"?id=eq."+encodeURIComponent(a.id),{method:"PATCH",headers:H({Prefer:"return=minimal"}),body:body});
  if(!r.ok)throw new Error("save");
  await load();
}
async function removeAthlete(id){
  if(!REMOTE){list=list.filter(function(a){return a.id!==id});persist();render();return}
  var r=await fetch(API+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:H()});
  if(!r.ok)throw new Error("del");
  await load();
}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return d}
function addMonths(s,n){var d=parse(s),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return d}
function fmt(d){return d.toLocaleDateString("pt-BR")}
function info(a){
  var today=new Date();today.setHours(0,0,0,0);
  var s=parse(a.start),e=addDays(a.start,90);
  var left=Math.round((e-today)/864e5),total=Math.round((e-s)/864e5);
  var pct=Math.max(0,Math.min(100,(total-left)/total*100));
  var lvl=left<=15?"bad":left<=30?"warn":"ok";
  var txt=left<0?"Venceu há "+(-left)+" dia"+(left===-1?"":"s"):left===0?"Vence HOJE":left===1?"Falta 1 dia":"Faltam "+left+" dias";
  return{s:s,e:e,left:left,pct:pct,lvl:lvl,txt:txt};
}
function esc(t){return t.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var items=list.map(function(a){return{a:a,i:info(a)}}).sort(function(x,y){return x.i.left-y.i.left});
  var bad=items.filter(function(x){return x.i.lvl==="bad"}).length,warn=items.filter(function(x){return x.i.lvl==="warn"}).length;
  document.getElementById("stats").innerHTML=list.length?
    '<span class="chip"><b>'+list.length+'</b> atletas</span><span class="chip" style="color:var(--bad)"><b>'+bad+'</b> urgentes (até 15 dias)</span><span class="chip" style="color:var(--warn)"><b>'+warn+'</b> atenção (até 30 dias)</span>':"";
  document.getElementById("vc").className="vb"+(view==="cards"?" on":"");
  document.getElementById("vt").className="vb"+(view==="table"?" on":"");
  var g=document.getElementById("grid");
  if(!items.length){g.className="";g.innerHTML='<div class="empty">Nenhum atleta ainda.<br>Clique em “+ Novo atleta” para começar.</div>';return}
  var acts=function(id){return '<button class="ghost" onclick="edit(\''+id+'\')">Editar</button><button class="ghost del" onclick="del(\''+id+'\')">Excluir</button>'};
  var av=function(a){return a.photo?'<img class="avatar" src="'+a.photo+'" alt="">':'<div class="avatar">'+esc(a.name.charAt(0).toUpperCase())+'</div>'};
  if(view==="table"){
    g.className="tablewrap";
    g.innerHTML='<table><thead><tr><th></th><th>Atleta</th><th>Início</th><th>Término</th><th>Situação</th><th>Ações</th></tr></thead><tbody>'+
    items.map(function(x){var a=x.a,i=x.i;
      return '<tr class="'+i.lvl+'"><td>'+av(a)+'</td><td><b>'+esc(a.name)+'</b></td><td>'+fmt(i.s)+'</td><td><b>'+fmt(i.e)+'</b></td><td><span class="badge '+i.lvl+'" style="'+(i.lvl==="bad"?"background:var(--bad);color:#fff":i.lvl==="warn"?"background:var(--warn);color:#000":"")+'">'+(i.lvl==="bad"?"⚠ ":"")+i.txt+'</span></td><td><div class="ac">'+acts(a.id)+'</div></td></tr>'}).join("")+'</tbody></table>';
    return}
  g.className="grid";
  g.innerHTML=items.map(function(x){var a=x.a,i=x.i;
    return '<div class="card '+i.lvl+'"><div class="top">'+av(a)+'<div><div class="name">'+esc(a.name)+'</div><div class="dates">Início: '+fmt(i.s)+'<br>Término: <b>'+fmt(i.e)+'</b></div></div></div>'+
    '<div class="bar"><i style="width:'+i.pct+'%"></i></div><div class="badge">'+(i.lvl==="bad"?"⚠ ":"")+i.txt+'</div>'+
    '<div class="actions">'+acts(a.id)+'</div></div>'}).join("");
}
function resize(file,cb){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var m=240,sc=Math.min(1,m/Math.min(im.width,im.height)),w=im.width*sc,h=im.height*sc;
    var c=document.createElement("canvas");c.width=m>w?w:m;c.height=m>h?h:m;
    var cw=Math.min(w,h),ctx=c.getContext("2d");c.width=c.height=Math.min(m,Math.min(im.width,im.height));
    var side=Math.min(im.width,im.height);
    ctx.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(file);
}
var dlg=document.getElementById("dlg"),$=function(i){return document.getElementById(i)};
function setPrev(){$("prev").innerHTML=photo?'<img class="avatar" style="width:64px;height:64px" src="'+photo+'" alt="">':"?"}
function updEnd(){var v=$("start").value;$("endinfo").textContent=v?"Término automático: "+fmt(addDays(v,90)):""}
function openDlg(a){editId=a?a.id:null;photo=a?a.photo:"";$("dtitle").textContent=a?"Editar atleta":"Novo atleta";
  $("name").value=a?a.name:"";$("start").value=a?a.start:iso(new Date());$("file").value="";setPrev();updEnd();dlg.showModal()}
function edit(id){openDlg(list.filter(function(a){return a.id===id})[0])}
async function del(id){if(!confirm("Excluir este atleta?"))return;try{await removeAthlete(id)}catch(e){alert("Não foi possível excluir. Tente novamente.")}}
$("add").onclick=function(){openDlg(null)};
$("cancel").onclick=function(){dlg.close()};
$("start").onchange=updEnd;
$("file").onchange=function(e){if(e.target.files[0])resize(e.target.files[0],function(d){photo=d;setPrev()})};
$("save").onclick=async function(){
  var n=$("name").value.trim(),s=$("start").value;
  if(!n||!s){alert("Preencha o nome e a data de início.");return}
  var btn=$("save");btn.disabled=true;
  try{await saveAthlete({id:editId,name:n,start:s,photo:photo},!editId);dlg.close()}
  catch(e){alert("Não foi possível salvar. Tente novamente.")}
  btn.disabled=false};
function setView(v){view=v;try{localStorage.setItem("atletas-view",v)}catch(e){}render()}
$("vc").onclick=function(){setView("cards")};
$("vt").onclick=function(){setView("table")};
load();
setInterval(function(){if(!dlg.open)render()},60000);
if(REMOTE)setInterval(function(){if(!dlg.open)load()},30000);
</script>
</body>
</html>
